<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="逃出大海 Escape the Sea">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c4"/>
      <stop offset="0.38" stop-color="#ffe08a"/>
      <stop offset="0.72" stop-color="#ffb03a"/>
      <stop offset="1" stop-color="#c9821f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.55" stop-color="#8ceaff"/>
      <stop offset="1" stop-color="#2ab8dd"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#6fe3ff" flood-opacity="0.35" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feOffset in="b" dy="4" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.55" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)" text-anchor="middle"
     font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif">
    <text x="640" y="150" font-size="152" font-weight="900" letter-spacing="20"
          fill="url(#gold)" stroke="#07161f" stroke-width="9" paint-order="stroke"
          stroke-linejoin="round">逃出大海</text>
    <text x="640" y="248" font-size="38" font-weight="700" letter-spacing="16"
          fill="url(#cyan)" stroke="#07161f" stroke-width="4.5" paint-order="stroke"
          stroke-linejoin="round">ESCAPE THE SEA</text>
  </g>
</svg>
